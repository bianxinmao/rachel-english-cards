<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英语学习卡片</title>
<style>
:root{
  --bg:#f7f6f3; --card:#ffffff; --ink:#1d2733; --muted:#6b7683;
  --line:#e5e2dc; --accent:#0e7a5f; --accent-soft:#e3f2ed;
  --warn:#b7791f; --warn-soft:#fdf3e0; --danger:#c0392b;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom));}
header{padding:8px 2px 18px;}
header h1{font-size:22px;letter-spacing:.5px;}
header p{color:var(--muted);font-size:13px;margin-top:4px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{
  flex:1;padding:11px 0;text-align:center;font-size:15px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.cat{font-size:13px;color:var(--accent);font-weight:600;margin:18px 2px 8px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;position:relative;
}
.card.due{border-color:var(--warn);background:var(--warn-soft);}
.row1{display:flex;align-items:center;gap:10px;}
.word{font-size:22px;font-weight:700;letter-spacing:.3px;}
.pos{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 7px;}
.speak{
  margin-left:auto;min-width:44px;height:38px;border:none;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);font-size:16px;cursor:pointer;
}
.speak:active{transform:scale(.95)}
.badge{
  display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;margin-top:8px;
  background:var(--bg);color:var(--muted);
}
.badge.due{background:var(--warn);color:#fff;}
.badge.done{background:var(--accent);color:#fff;}
.ipa{font-family:"Times New Roman",serif;color:var(--accent);font-size:15px;margin-top:5px;}
.cn{font-size:15px;margin-top:7px;}
.ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.ex .en{font-size:14.5px;line-height:1.5;}
.ex .zh{font-size:13.5px;color:var(--muted);margin-top:3px;}
.use{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.55;}
.use b{color:var(--ink);font-weight:600;}
/* 复习 */
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px;margin-bottom:12px;}
.rv-word{font-size:26px;font-weight:700;text-align:center;}
.rv-ipa{text-align:center;color:var(--accent);font-family:"Times New Roman",serif;margin:6px 0 14px;}
.rv-speak{display:block;margin:0 auto 14px;min-width:88px;height:44px;border:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:16px;cursor:pointer;}
.rv-cn{display:none;text-align:center;font-size:17px;margin-bottom:16px;color:var(--ink);}
.rv-btns{display:flex;gap:10px;}
.rv-btns button{flex:1;padding:14px 0;border:none;border-radius:12px;font-size:15px;cursor:pointer;min-height:48px;}
.b-yes{background:var(--accent);color:#fff;}
.b-no{background:#fbeaea;color:var(--danger);}
.rv-next{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;display:none;}
.rv-empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.8;}
.rv-empty b{color:var(--ink);}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}
/* 自测 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px;}
.q-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px;}
.q-word{font-size:24px;font-weight:700;text-align:center;margin:14px 0 4px;}
.q-ipa{text-align:center;color:var(--accent);font-family:"Times New Roman",serif;margin-bottom:16px;}
.opt{
  display:block;width:100%;text-align:left;padding:14px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;cursor:pointer;min-height:48px;
}
.opt.right{border-color:var(--accent);background:var(--accent-soft);}
.opt.wrong{border-color:var(--danger);background:#fbeaea;}
.opt:disabled{cursor:default;}
.next{
  width:100%;padding:13px;border:none;border-radius:12px;background:var(--ink);
  color:#fff;font-size:15px;cursor:pointer;margin-top:4px;min-height:48px;
}
.next:disabled{opacity:.35;}
.done{text-align:center;padding:30px 10px;}
.done .big{font-size:40px;font-weight:800;color:var(--accent);}
.done p{color:var(--muted);margin:10px 0 18px;}
/* bottom bar */
.bottom{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bottom .bar{max-width:520px;margin:0 auto;}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s;}
.bl{font-size:12px;color:var(--muted);text-align:center;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>英语学习卡片</h1>
    <p>艾宾浩斯记忆法：1 → 2 → 4 → 7 → 15 → 30 天循环复习　<a href="javascript:void(0)" onclick="resetProg()" style="color:var(--danger);font-size:12px">重置进度</a></p>
  </header>
  <div class="tabs">
    <button class="tab on" id="tabLearn">学习</button>
    <button class="tab" id="tabReview">复习</button>
    <button class="tab" id="tabQuiz">自测</button>
  </div>
  <div id="learn"></div>
  <div id="review" style="display:none"></div>
  <div id="quiz" style="display:none"></div>
</div>
<div class="bottom"><div class="bar">
  <div class="prog"><i id="pbar" style="width:0%"></i></div>
  <div class="bl" id="pinfo">已学 0 / 0</div>
</div></div>

let extra=parseInt(localStorage.getItem('eng_extra')||'0',10)||0;
DATA.push.apply(DATA,BANK.slice(0,extra));
function unlockNew(){
  const todayStr=new Date().toDateString();
  if(localStorage.getItem('eng_unlock_date')===todayStr){alert('今天的新词已解锁，明天再来！记忆需要时间沉淀~');return;}
  const add=BANK.slice(extra,extra+5);
  if(!add.length){alert('本期词库已学完，我会不定期补充新词');return;}
  DATA.push.apply(DATA,add);
  extra+=add.length;
  localStorage.setItem('eng_extra',String(extra));
  localStorage.setItem('eng_unlock_date',todayStr);
  renderLearn();updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
  alert('已解锁5个新词，就在列表最下方！');
}
const learnEl=document.getElementById('learn'),quizEl=document.getElementById('quiz'),rvEl=document.getElementById('review');
const pbar=document.getElementById('pbar'),pinfo=document.getElementById('pinfo');
/* 迁移旧数据 */
let prog;
try{prog=JSON.parse(localStorage.getItem('eng_prog')||'null')||{};}catch(e){prog={};}
if(!Object.keys(prog).length){
  const old=new Set(JSON.parse(localStorage.getItem('eng_seen')||'[]'));
  if(old.size){DATA.forEach((d,i)=>{if(old.has(String(i)))prog[d.w]={s:0,d:Date.now()+DAY};});}
}
function saveProg(){localStorage.setItem('eng_prog',JSON.stringify(prog));}
function touch(w){
  if(!prog[w]){prog[w]={s:0,d:Date.now()+IV[0]*DAY};saveProg();updateProg();}
}
function fmtDue(ms){
  const diff=ms-Date.now();
  if(diff<=0)return '今日待复习';
  if(diff<3600e3)return Math.ceil(diff/MIN)+'分钟后';
  if(diff<DAY)return Math.ceil(diff/3600e3)+'小时后';
  return Math.ceil(diff/DAY)+'天后';
}
function badgeHtml(w){
  const p=prog[w];
  if(!p)return '';
  if(p.s>=IV.length)return '<span class="badge done">已完成6轮记忆 ✓</span>';
  const due=p.d<=Date.now();
  return '<span class="badge'+(due?' due':'')+'">'+(due?'🔴 今日待复习':'第'+(p.s+1)+'轮 · '+fmtDue(p.d)+'复习')+'</span>';
}
function speak(t){
  try{
    if(speak.cur){speak.cur.pause();speak.cur=null;}
    const a=new Audio('audio/'+t.replace(/ /g,'_')+'.mp3');
    speak.cur=a;
    const p=a.play();
    if(p)p.catch(()=>fallbackTTS(t));
    return;
  }catch(e){}
  fallbackTTS(t);
}
function fallbackTTS(t){
  if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音，请换 Safari 打开');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='en-US';u.rate=0.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function speakWord(w){speak(w);touch(w);refreshBadges(w);}
function updateProg(){
  const n=Object.keys(prog).length;
  pbar.style.width=(n/DATA.length*100)+'%';
  pinfo.textContent='已学 '+n+' / '+DATA.length+' · 待复习 '+dueList().length;
}
function dueList(){
  return DATA.filter(d=>prog[d.w]&&prog[d.w].s<IV.length&&prog[d.w].d<=Date.now()).map(d=>d.w);
}
function refreshBadges(w){
  const el=document.getElementById('bd_'+w.replace(/ /g,'_'));
  if(el)el.outerHTML='<span id="bd_'+w.replace(/ /g,'_')+'">'+badgeHtml(w)+'</span>';
}
function renderLearn(){
  let lastCat='';
  let html='';
  const initialDone=DATA.slice(0,24).every(d=>prog[d.w]);
  const unlockedAll=extra>=BANK.length;
  if(initialDone && !unlockedAll){
    const unlockedToday=localStorage.getItem('eng_unlock_date')===new Date().toDateString();
    const remain=BANK.length-extra;
    html+='<div class="card" style="text-align:center;background:var(--accent-soft);border-color:var(--accent)">'+
      '<div style="font-size:15px;font-weight:600;">初始 24 词已全部开始学习 🎉</div>'+
      '<div style="font-size:13px;color:var(--muted);margin:6px 0 10px;">每天可解锁 5 个新词（剩余词库 '+remain+' 个）</div>'+
      '<button class="next" style="max-width:240px;margin:0 auto;'+(unlockedToday?'opacity:.4':'')+'" onclick="unlockNew()">'+
      (unlockedToday?'今日已解锁，明天再来':'解锁今日 5 个新词')+'</button></div>';
  }else if(!initialDone){
    html+='<div class="hint" style="text-align:center;margin-bottom:10px;">学完初始 24 词后，每天解锁 5 个新词（'+DATA.slice(0,24).filter(d=>prog[d.w]).length+'/24）</div>';
  }
  html+=DATA.map((d)=>{
    const id=d.w.replace(/ /g,'_');
    let html='';
    if(d.c!==lastCat){lastCat=d.c;html+='<div class="cat">'+d.c+'</div>';}
    html+='<div class="card'+(prog[d.w]&&prog[d.w].d<=Date.now()?' due':'')+'">'+
      '<div class="row1"><span class="word">'+d.w+'</span><span class="pos">'+d.pos+'</span>'+
      '<button class="speak" onclick="speakWord(\''+d.w.replace(/'/g,"\\'")+'\')" aria-label="发音">🔊</button></div>'+
      '<div id="bd_'+id+'">'+badgeHtml(d.w)+'</div>'+
      '<div class="ipa">'+d.ipa+'</div>'+
      '<div class="cn">'+d.cn+'</div>'+
      '<div class="ex"><div class="en">'+d.ex+'</div><div class="zh">'+d.exzh+'</div></div>'+
      '<div class="use">用法：'+d.use+'</div></div>';
    return html;
  }).join('');
  learnEl.innerHTML=html;
}
/* 复习 */
let rvQueue=[],rvIdx=0;
function renderReview(){
  if(!rvQueue.length){
    rvQueue=dueList();rvIdx=0;
  }
  if(!rvQueue.length){
    const upcoming=DATA.filter(d=>prog[d.w]&&prog[d.w].s<IV.length);
    const nextT=upcoming.length?Math.min(...upcoming.map(d=>prog[d.w].d)):0;
    rvEl.innerHTML='<div class="rv-card rv-empty">🎉 今日复习任务已完成！<br>已进入记忆循环的单词：'+upcoming.length+' 个'+
      (nextT?'<br>最近一次复习：<b>'+fmtDue(nextT)+'</b>':'')+
      '<br><br>新学的词点🔊后自动加入复习计划</div>';
    updateProg();
    return;
  }
  const w=rvQueue[rvIdx];
  const d=DATA.find(x=>x.w===w);
  rvEl.innerHTML='<div class="rv-card">'+
    '<div class="hint">复习 '+(rvIdx+1)+' / '+rvQueue.length+' · 第'+(prog[w].s+1)+'轮记忆</div>'+
    '<div class="rv-word">'+d.w+'</div>'+
    '<div class="rv-ipa">'+d.ipa+'</div>'+
    '<button class="rv-speak" onclick="speak(\''+d.w.replace(/'/g,"\\'")+'\')">🔊 听发音</button>'+
    '<div class="rv-cn" id="rvcn">'+d.cn+'<br><span style="font-size:13px;color:var(--muted)">'+d.ex+'</span></div>'+
    '<div class="rv-btns">'+
      '<button class="b-no" onclick="grade(false)">😅 没记住</button>'+
      '<button class="b-yes" onclick="grade(true)">😄 记住了</button>'+
    '</div>'+
    '<button class="rv-next" id="rvnx" onclick="rvIdx++;renderReview()">下一个 →</button>'+
    '<div class="hint">想不起释义再点「显示」，然后如实评分</div>'+
  '</div>';
  const btn=document.createElement('button');
  btn.className='next';btn.textContent='显示释义';
  btn.onclick=function(){document.getElementById('rvcn').style.display='block';btn.style.display='none';};
  rvEl.querySelector('.rv-next').before(btn);
}
function grade(ok){
  const w=rvQueue[rvIdx];
  const p=prog[w];
  if(ok){
    p.s=Math.min(p.s+1,IV.length);
    p.d=p.s>=IV.length?null:Date.now()+IV[p.s]*DAY;
  }else{
    p.s=0;p.d=Date.now()+30*MIN; /* 30分钟后重新出现 */
  }
  saveProg();
  document.getElementById('rvnx').style.display='block';
  document.querySelectorAll('.rv-btns button').forEach(b=>b.disabled=true);
}
/* 自测 */
let qs=[],qi=0,score=0,answered=false;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5);}
function startQuiz(){
  qs=shuffle(DATA).map(d=>{
    const wrongs=shuffle(DATA.filter(x=>x!==d)).slice(0,3).map(x=>x.cn);
    return {w:d.w,ipa:d.ipa,answer:d.cn,opts:shuffle([d.cn,...wrongs])};
  });
  qi=0;score=0;renderQ();
}
function renderQ(){
  answered=false;
  if(qi>=qs.length){
    quizEl.innerHTML='<div class="quiz-card done"><div class="big">'+score+' / '+qs.length+'</div><p>本轮测试完成</p><button class="next" onclick="startQuiz()">再来一轮</button></div>';
    return;
  }
  const q=qs[qi];
  quizEl.innerHTML='<div class="quiz-card">'+
    '<div class="q-head"><span>第 '+(qi+1)+' / '+qs.length+' 题</span><span>得分 '+score+'</span></div>'+
    '<div class="q-word">'+q.w+' <button class="speak" onclick="speak(\''+q.w.replace(/'/g,"\\'")+'\')" aria-label="发音">🔊</button></div>'+
    '<div class="q-ipa">'+q.ipa+'</div>'+
    q.opts.map(o=>'<button class="opt" onclick="pick(this,\''+q.answer.replace(/'/g,"\\'")+'\')">'+o+'</button>').join('')+
    '<button class="next" id="nx" disabled onclick="qi++;renderQ()">下一题</button></div>';
}
function pick(btn,ans){
  if(answered)return;answered=true;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===ans)b.classList.add('right');
  });
  if(btn.textContent===ans)score++;else btn.classList.add('wrong');
  document.getElementById('nx').disabled=false;
}
/* tabs */
const tabs={learn:document.getElementById('tabLearn'),review:document.getElementById('tabReview'),quiz:document.getElementById('tabQuiz')};
function show(name){
  Object.entries(tabs).forEach(([k,b])=>b.classList.toggle('on',k===name));
  learnEl.style.display=name==='learn'?'':'none';
  rvEl.style.display=name==='review'?'':'none';
  quizEl.style.display=name==='quiz'?'':'none';
  if(name==='review'){rvQueue=[];renderReview();}
  if(name==='quiz')startQuiz();
  if(name==='learn')renderLearn();
}
tabs.learn.onclick=()=>show('learn');
tabs.review.onclick=()=>show('review');
tabs.quiz.onclick=()=>show('quiz');
function resetProg(){
  if(confirm('确定清空全部学习和复习进度，从零开始吗？')){
    localStorage.removeItem('eng_prog');
    localStorage.removeItem('eng_seen');
    prog={};
    renderLearn();updateProg();
    alert('已重置。点单词旁的🔊即可重新开始学习。');
  }
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices();}
renderLearn();updateProg();
</script>
